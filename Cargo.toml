[package]
name = "pacclean"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Arch 'pacman -Sc' with 'CleanMethod = KeepCurrent' analogue, but more verbose and faster."
repository = "https://github.com/HanabishiRecca/pacclean"
license = "MIT"
readme = "README.md"
publish = false

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[dependencies]
alpm = "4.0"
